# HAL Model Catalog — per-model metadata for the /models picker
# Schema: address (provider/id), tier, paid, modality, context_window,
#         tags[], strengths[], description
# Synced with config/providers.yaml — every add/sunset touches BOTH files.
#
# Tiers: subscription | frontier | premium | mid | cheap | local
# Modalities: text | text+vision | text+vision+audio | image | video | tts | specialist
#
# Last refresh: 2026-10-17 (claude-haiku-5-5 added and claude-sonnet-5-5 probe-verified by
#               GRIP#8213, no default moved; claude-sonnet-5-5 first added 2026-10-16 by
#               GRIP#8413 as the Pro tier's launch default, documented only). Before that
#               2026-09-24 (claude-opus-5-5 added 2026-09-23 by GRIP#6563, probe-verified,
#               now grip-default; claude-opus-5 demoted. Base 2026-06-24 adversarial research)
#
# Every anthropic/ row here must also be carried by providers.yaml, the cost tracker
# (its OWN row) and, when 1M, bin/grip's _GRIP_1M_MODELS — tests/test_model_onboarding_parity.py
# fails naming the file that lacks it.

