    models: auto

  - name: vllm
    type: local
    base_url: http://localhost:8000
    detect: true
    models: auto

  - name: lmstudio
    type: local
    base_url: http://localhost:1234
    detect: true
    models: auto

  - name: mlx_vlm
    type: local
    base_url: http://localhost:8080
    auth: none
    detect: true
    models: auto
    timeout_s: 180
    # mlx-vlm v0.4.3: vision, audio, OCR, object detection, segmentation
    # Start: uv pip install -U mlx-vlm && python -m mlx_vlm.server --port 8080

routing:
  default: fallback
  # UPDATED 2026-06-24: was groq/llama-3.3-70b-versatile — deprecated Groq 2026-06-17
  default_model: groq/openai/gpt-oss-120b
  # Ordering: speed (Groq infra) → reliability (Gemini 1M-ctx) → frontier (xAI)
  #   → cost (OpenRouter passthrough, Qwen) → quality-cost (DeepSeek) → local (Ollama)
  fallback_chain:
    - groq/openai/gpt-oss-120b
    - gemini/gemini-3.5-flash-lite
    - xai/grok-4.3
    - openrouter/deepseek/deepseek-v4-flash
    - qwen/qwen3.5-flash
    - deepseek/deepseek-flash
    - ollama/gemma4:26b

  quality_cost:
    simple:  groq/openai/gpt-oss-120b
    standard: openrouter/deepseek/deepseek-v4-flash
    complex: gemini/gemini-3.1-pro-preview
    local:   ollama/gemma4:26b

  # Tier-scoped fallback chains — failures stay within cost tier before escalating
  tier_chains:
    free:    [ollama/gemma4:26b, openrouter/openrouter/free]
    cheap:   [groq/openai/gpt-oss-20b, qwen/qwen3.5-flash, openrouter/deepseek/deepseek-v4-flash]
    mid:     [gemini/gemini-3.5-flash-lite, deepseek/deepseek-flash, moonshot/kimi-k2.6]
    premium: [xai/grok-4.3, gemini/gemini-3.1-pro-preview, qwen/qwen3.7-max, moonshot/kimi-k2.7-code]

  # Council models for cross-LLM deliberation (HALCouncil)
  # Architecture diversity: Groq OSS, Google, xAI, Alibaba, DeepSeek, Mistral open-weight
  council:
    - groq/openai/gpt-oss-120b
    - gemini/gemini-3.5-flash-lite
    - xai/grok-4.3
    - qwen/qwen3.7-max
    - deepseek/deepseek-flash
    - mistral/mistral-large-latest
