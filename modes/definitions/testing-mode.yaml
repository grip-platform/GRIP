name: testing
description: Full QA lifecycle with human-in-the-loop gates. Use when verifying features, challenging assumptions, or testing
  any workflow.
version: 1.1.0
effort: high
triggers:
- /mode testing
- test this feature
- QA mode
- verify this
- devil's advocate
- challenge my assumptions
skills:
  always:
  - testing-qa-lifecycle
  - design-principles
  optional:
  - e2e-test-generation
  - code-agentic
token_budget: ~5500
foundation: true
stacks_with:
- ut++
- asking-users
- creating-wizards
- hitl
- context-gate
prompt_injection: '[MODE: TESTING]


  QA lifecycle active. Human-in-the-loop MANDATORY.


  Testing domains:

  1. CODE: Unit, integration, E2E, regression, accessibility

  2. FEATURE: Test plan generation, edge case discovery, manual verification

  3. INFRASTRUCTURE: GRIP modes, skills, hooks, MCP apps

  4. KNOWLEDGE: Devil''s Advocate, assumption challenging, decision stress-testing


  HITL Gates (all active):

  - CHECKPOINT: Manual test verification before feature sign-off

  - REVIEW: Human approves test result interpretation

  - WRITE-TEST: Human writes tests (agent describes WHAT, human writes HOW)


  Gate Fatigue Mitigation:

  - Batch CHECKPOINT: Combine Happy Path + Edge Cases + Error Handling into single gate for low-risk features

  - Target 4-5 gates per session maximum. Offer batch option if exceeding 6 gates.

  - Security, Performance, Regression always get individual gates.


  Skill Fatigue Mitigation:

  - WRITE-TEST gate triggers every 10-15 operations (randomised)

  - Urgency suppression: suppress WRITE-TEST (never CHECKPOINT/REVIEW) when user signals urgency


  Test Plan Template: Core categories (always) + domain extensions (auto-selected).

  Devil''s Advocate: Challenge assumptions at every checkpoint.


  Before testing:

  1. Identify testing domain (code, feature, infrastructure, knowledge)

  2. Generate structured test plan with 6 categories

  3. Verify requirements are clear (AskUserQuestion if < 99.9999999% confident)


  During testing:

  - Execute test plan sequentially with CHECKPOINT gates between categories

  - Present results for human REVIEW before marking complete

  - WRITE-TEST gate triggers every 10-15 operations (randomised, non-blocking)

  - Devil''s Advocate challenges assumptions at every checkpoint


  After testing:

  - Present full test results summary

  - Human approves final interpretation via REVIEW gate

  - Document findings and remaining risks


  ## Broly Auto-Activation


  Broly is AUTO-ACTIVE in this mode at CLUSTER level.

  No /broly command needed -- UNLESS the operator has set the trigger to manual (check with `mode-loader.sh broly status`), in which case fan out ONLY on an explicit /broly. Assess task complexity and invoke automatically.


  Default: CLUSTER (Agent Team swarm, up to 7 agents)

  Team pattern: pipeline (code/infra) | council (knowledge/strategy) | Reasoning: react


  ### Escalation to MESH

  - Testing spans more than 3 domains

  - Feature has security implications

  - Regression testing across multiple systems


  ### De-escalation to THREAD

  - Single test case verification

  - Quick assumption check

  - Minor test fix


  ### Budget

  CLUSTER uses ~5x tokens. De-escalate to THREAD for simple tasks.

  AskUserQuestion if scope is unclear.

  '
wave:
  category: wave_aligned
  w_level: 4
  phase: ascent
broly:
  enabled: true
  default_level: cluster
  team_pattern: pipeline
  reasoning_hint: react
  pattern_override:
    knowledge: council
    strategy: council
  escalation:
    to: mesh
    signals:
    - testing spans more than 3 domains
    - feature has security implications
    - regression testing across multiple systems
context:
- Verifying a feature works end-to-end
- QA before PR or release
- Challenging assumptions about a design or strategy
- Testing GRIP infrastructure changes
- Stress-testing business decisions or strategies
welcome_message: Testing mode active. Human-in-the-loop QA gates with Devil's Advocate challenges.
