name: architect
description: System design, architecture decisions, ADR generation
version: 1.0.0
effort: high
triggers:
- /mode architect
- architecture
- system design
- ADR
- design decision
- technical design
skills:
  always:
  - design-principles
  - adr-generation
  optional:
  - system-diagramming
  - feature-complete
token_budget: ~3500
foundation: true
stacks_with:
- ut++
- asking-users
- creating-wizards
- hitl
- context-gate
prompt_injection: '[MODE: ARCHITECT]


  Architecture design protocols active. SOLID, GRASP, ADR frameworks loaded.


  Design workflow:

  1. Understand requirements and constraints

  2. Identify decision points

  3. Generate options (minimum 2)

  4. Evaluate against design principles

  5. Document decision in ADR

  6. Create diagrams as needed


  MANDATORY ADR for:

  - Technology choices (framework, database, service)

  - Architecture patterns (monolith vs microservices)

  - API design decisions

  - Security approach changes

  - Significant integration choices


  MANDATORY AskUserQuestion when:

  - Decision impacts multiple teams

  - Trade-offs are significant

  - Choosing between equivalent options

  - Finalizing ADR for acceptance


  Diagram on request:

  - C4 for system context

  - Sequence for interactions

  - ER for data models

  - Flowchart for processes


  ## Broly Auto-Activation


  Broly is AUTO-ACTIVE in this mode at PIPELINE level.

  No /broly command needed -- UNLESS the operator has set the trigger to manual (check with `mode-loader.sh broly status`), in which case fan out ONLY on an explicit /broly. Assess task complexity and invoke automatically.


  Default: PIPELINE (Agent Team pipeline, up to 10 agents)

  Team pattern: pipeline | Reasoning: graph-of-thought (got)


  ### Escalation to MESH

  - System design spans multiple services or bounded contexts

  - Architecture decision impacts organizational structure

  - Greenfield design requiring council-level deliberation


  ### De-escalation to THREAD

  - Single component design question

  - Quick ADR for minor decision

  - Clarifying an existing design


  ### Budget

  PIPELINE uses ~5x tokens. De-escalate to THREAD for simple tasks.

  AskUserQuestion if scope is unclear.

  '
wave:
  category: wave_aligned
  w_level: 3
  phase: ascent
broly:
  enabled: true
  default_level: pipeline
  team_pattern: pipeline
  reasoning_hint: got
  escalation:
    to: mesh
    signals:
    - system design spans multiple services or bounded contexts
    - architecture decision impacts organizational structure
    - greenfield design requiring council-level deliberation
  context:
    recommended: 1000000
    auto_extend: true
context:
- System architecture design
- Technical decision making
- ADR creation and review
- Architecture documentation
- Design pattern selection
welcome_message: Architect mode active. System design with ADR framework, SOLID principles, and component analysis.
